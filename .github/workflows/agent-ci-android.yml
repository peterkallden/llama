name: Agent verification (Android)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/llama-agent
    paths:
      - '.github/workflows/agent-ci-android.yml'
      - 'common/agent/**'
      - 'common/memory/**'
      - 'common/plan/**'
      - 'vendor/sqlite/**'
      - 'pocs/agent/**'
      - 'tools/agent/**'
      - 'examples/llama.android/**'
      - 'CMakeLists.txt'
      - '**/CMakeLists.txt'
  pull_request:
    branches:
      - feature/llama-agent
    paths:
      - '.github/workflows/agent-ci-android.yml'
      - 'common/agent/**'
      - 'common/memory/**'
      - 'common/plan/**'
      - 'vendor/sqlite/**'
      - 'pocs/agent/**'
      - 'tools/agent/**'
      - 'examples/llama.android/**'
      - 'CMakeLists.txt'
      - '**/CMakeLists.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4

permissions:
  contents: read

jobs:
  agent-android-dev:
    name: Build agent development app (Android)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install Vulkan host headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan-dev

      - name: Build Android development project
        working-directory: examples/llama.android
        run: >-
          ./gradlew :app:assembleDebug :lib:assembleRelease
          :lib:testDebugUnitTest --no-daemon --max-workers=4

      - name: Verify Android CPU and Vulkan backends
        run: |
          set -euo pipefail
          aar=$(find examples/llama.android/lib/build/outputs/aar -name '*.aar' -print -quit)
          test -n "${aar}"
          unzip -l "${aar}" | grep -q 'jni/arm64-v8a/libggml-cpu-android_armv8.0_1.so'
          unzip -l "${aar}" | grep -q 'jni/arm64-v8a/libggml-vulkan.so'

      - name: Upload Android development artifact
        uses: actions/upload-artifact@v6
        with:
          name: llama-agent-dev-android
          path: |
            examples/llama.android/app/build/outputs/**/*.apk
            examples/llama.android/lib/build/outputs/**/*.aar
          if-no-files-found: error
          retention-days: 14

  agent-android-ndk:
    name: Build agent Android native target
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: '29.0.14206865'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install Vulkan host headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan-dev

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure native development build
        run: |
          cmake -S . -B build-agent-android -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DGGML_NATIVE=OFF \
            -DGGML_VULKAN=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_OPENMP=OFF \
            -DVulkan_GLSLC_EXECUTABLE="${ANDROID_NDK}/shader-tools/linux-x86_64/glslc" \
            -DVulkan_GLSLANG_VALIDATOR_EXECUTABLE="${ANDROID_NDK}/shader-tools/linux-x86_64/glslc" \
            -DSPIRV-Headers_DIR="${GITHUB_WORKSPACE}/examples/llama.android/lib/src/main/cpp/cmake/SPIRV-Headers" \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_AGENT_RUNTIME=OFF \
            -DLLAMA_AGENT_STORAGE_SQLITE=OFF

      - name: Build native development target
        run: cmake --build build-agent-android --parallel 4

      - name: Upload Android native artifact
        uses: actions/upload-artifact@v6
        with:
          name: llama-agent-dev-android-native
          path: build-agent-android/bin/**
          if-no-files-found: error
          retention-days: 14

  agent-android-storage-smoke:
    name: Smoke test native SQLite storage (Android)
    runs-on: ubuntu-24.04
    # This job performs a complete native/Gradle build before starting the
    # emulator. Keep enough wall-clock budget for both phases on a cold runner.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Install Vulkan host headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan-dev

      - name: Run Android SQLite instrumentation smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect
          force-avd-creation: true
          disable-spellchecker: true
          working-directory: examples/llama.android
          script: |
            set -euo pipefail
            adb wait-for-device
            for attempt in $(seq 1 60); do
              boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              package_service=$(adb shell cmd package list packages 2>/dev/null || true)
              if [ "$boot_completed" = "1" ] && [ -n "$package_service" ]; then
                break
              fi
              if [ "$attempt" = "60" ]; then
                echo "Android package service did not become ready" >&2
                adb shell getprop sys.boot_completed || true
                adb shell service check package || true
                exit 1
              fi
              sleep 2
            done
            ./gradlew :lib:connectedDebugAndroidTest --no-daemon --max-workers=3
