name: Agent development package (Debian, Ubuntu)

on:
  workflow_run:
    workflows:
      - Agent development package
    types:
      - completed
    branches:
      - feature/llama-agent
  workflow_dispatch:
    inputs:
      source_ref:
        description: Verified package source branch; must be feature/llama-agent
        required: true
        default: feature/llama-agent
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: agent-debian-development-package-${{ github.event.workflow_run.head_branch || inputs.source_ref }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

env:
  COZO_VERSION: '0.7.6'
  LLAMA_AGENT_BACKEND: cpu
  LLAMA_AGENT_NATIVE: off

jobs:
  package:
    name: Package Debian/Ubuntu development build
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_branch == 'feature/llama-agent' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.source_ref == 'feature/llama-agent')
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout verified source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.source_ref }}

      - name: Install Debian and agent build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            clangd \
            cmake \
            curl \
            debhelper-compat \
            dpkg-dev \
            git \
            libssl-dev \
            ninja-build \
            pkg-config \
            zlib1g-dev

      - name: Provision Cozo C API
        shell: bash
        run: |
          set -euo pipefail
          cozo_root="$RUNNER_TEMP/cozo-${COZO_VERSION}"
          cozo_lib="$RUNNER_TEMP/libcozo_c-${COZO_VERSION}.so"
          git clone --depth 1 --branch "v${COZO_VERSION}" \
            https://github.com/cozodb/cozo.git "$cozo_root"
          curl --fail --location --retry 3 \
            "https://github.com/cozodb/cozo/releases/download/v${COZO_VERSION}/libcozo_c-${COZO_VERSION}-x86_64-unknown-linux-gnu.so.gz" \
            | gzip -d > "$cozo_lib"
          test -s "$cozo_root/cozo-lib-c/cozo_c.h"
          test -s "$cozo_lib"
          echo "COZO_INCLUDE_DIR=$cozo_root/cozo-lib-c" >> "$GITHUB_ENV"
          echo "COZO_LIBRARY=$cozo_lib" >> "$GITHUB_ENV"

      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          dpkg-buildpackage -us -uc -b
          mkdir -p debian-artifacts
          shopt -s nullglob
          packages=(../llama-agent_*.deb)
          ((${#packages[@]} > 0)) || {
            echo 'dpkg-buildpackage did not produce a llama-agent package' >&2
            exit 1
          }
          cp "${packages[@]}" debian-artifacts/
          printf '%s\n' \
            "package=llama-agent" \
            "source_branch=${{ github.event.workflow_run.head_branch || inputs.source_ref }}" \
            "commit_sha=$(git rev-parse HEAD)" \
            "backend=$LLAMA_AGENT_BACKEND" \
            "cozo_version=$COZO_VERSION" \
            "workflow_run_id=${GITHUB_RUN_ID}" \
            "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > debian-artifacts/AGENT-DEBIAN-PACKAGE-MANIFEST.txt

      - name: Check Debian package metadata
        shell: bash
        run: |
          set -euo pipefail
          dpkg-deb --info debian-artifacts/llama-agent_*.deb
          dpkg-deb --contents debian-artifacts/llama-agent_*.deb \
            | grep -F 'usr/sbin/llama-agent-daemon'
          dpkg-deb --contents debian-artifacts/llama-agent_*.deb \
            | grep -F 'usr/share/doc/llama-agent/examples/'

      - name: Publish Debian development package
        uses: actions/upload-artifact@v6
        with:
          name: llama-agent-deb-dev-${{ github.run_id }}
          path: debian-artifacts/**
          if-no-files-found: error
          retention-days: 30

      - name: Retain only the five newest Debian development packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[]
              | select(.name | startswith("llama-agent-deb-dev-"))
              | [.created_at, (.id | tostring)]
              | @tsv' \
            | sort -r \
            | tail -n +6 \
            | cut -f2 \
            | while IFS= read -r artifact_id; do
                if [[ -n "$artifact_id" ]]; then
                  echo "Deleting older Debian development package artifact $artifact_id"
                  gh api --method DELETE \
                    "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
                fi
              done
