name: Agent feature Docker image

on:
  workflow_run:
    workflows:
      - Agent feature package
    types:
      - completed
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Successful agent-package workflow run ID to consume
        required: true
        type: string
      source_ref:
        description: Source ref containing the Dockerfile
        required: true
        default: feature/llama-agent
        type: string

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: agent-docker-${{ github.event.workflow_run.head_branch || inputs.source_ref }}-${{ github.event.workflow_run.head_sha || inputs.package_run_id }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build and publish feature agent image
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'feature/llama-agent' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.package_run_id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out image definition
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.source_ref }}

      - name: Download published agent package
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN_ID: ${{ github.event.workflow_run.id || inputs.package_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package-artifact
          gh run download "$PACKAGE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --dir package-artifact

          archive="$(find package-artifact -type f -name 'llama-agent-feature-*.tar.gz' -print -quit)"
          checksum="$(find package-artifact -type f -name 'llama-agent-feature-*.tar.gz.sha256' -print -quit)"
          test -n "$archive"
          test -n "$checksum"
          (cd "$(dirname "$archive")" && sha256sum --check "$(basename "$checksum")")

          mkdir -p docker-context
          cp "$archive" docker-context/agent-package.tar.gz
          cp docker/agent/Dockerfile docker-context/Dockerfile
          cp docker/agent/entrypoint.sh docker-context/entrypoint.sh
          cp docker/agent/agent-config.docker.example.json \
            docker-context/agent-config.docker.example.json
          package_id="$(basename "$archive" .tar.gz)"
          safe_package_tag="${package_id#llama-agent-feature-}"
          echo "package_id=$package_id" >> "$GITHUB_OUTPUT"
          echo "safe_package_tag=$safe_package_tag" >> "$GITHUB_OUTPUT"
        id: package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          image_repo="ghcr.io/$(tr '[:upper:]' '[:lower:]' <<< "$REPOSITORY")/llama-agent-dev"
          {
            echo "image_repo=$image_repo"
            echo "tags<<TAGS"
            echo "$image_repo:cpu-amd64-latest"
            echo "$image_repo:cpu-amd64-${{ steps.package.outputs.safe_package_tag }}"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push CPU image
        uses: docker/build-push-action@v7
        with:
          context: docker-context
          file: docker-context/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=llama-agent
            org.opencontainers.image.description=llama-agent feature package image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
            org.opencontainers.image.version=${{ steps.package.outputs.package_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
