name: Agent release packages

on:
  push:
    tags:
      - llama-agent-v*
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag, for example llama-agent-v0.1.0
        required: true
        type: string
      source_ref:
        description: Master branch or commit in the master history to build
        required: true
        default: master
        type: string

permissions:
  contents: write

concurrency:
  group: agent-release-${{ github.ref }}
  cancel-in-progress: false

env:
  COZO_VERSION: '0.7.6'
  CUDA_TOOLKIT_PACKAGE: cuda-toolkit-13-3
  VULKAN_SDK_VERSION: '1.4.350.1'
  VULKAN_SDK_SHA256: 6cce33c7e5383814150c5041820769d93c65a1fd883002e5949b067045a07daa
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  build-release:
    name: Build ${{ matrix.backend }} release package
    runs-on: ubuntu-24.04
    # CUDA agent builds can exceed one hour on GitHub-hosted runners.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        backend:
          - cpu
          - cuda
          - vulkan

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0

      - name: Verify release source is on master history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --no-tags
          git merge-base --is-ancestor HEAD origin/master || {
            echo 'Release source must be an ancestor of origin/master' >&2
            exit 1
          }

      - name: Install common build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            clangd \
            cmake \
            curl \
            git \
            libssl-dev \
            ninja-build \
            xz-utils \
            zlib1g-dev

      - name: Install CUDA Toolkit
        if: matrix.backend == 'cuda'
        shell: bash
        run: |
          set -euo pipefail
          # Official NVIDIA CUDA Toolkit repository and download instructions:
          # https://developer.nvidia.com/cuda-downloads
          curl --fail --location --retry 3 \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb \
            --output "$RUNNER_TEMP/cuda-keyring.deb"
          sudo dpkg -i "$RUNNER_TEMP/cuda-keyring.deb"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "$CUDA_TOOLKIT_PACKAGE"
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
          echo "CUDA_HOME=/usr/local/cuda" >> "$GITHUB_ENV"
          export PATH="/usr/local/cuda/bin:$PATH"
          nvcc --version

      - name: Install Vulkan SDK
        if: matrix.backend == 'vulkan'
        shell: bash
        run: |
          set -euo pipefail
          # Official LunarG Vulkan SDK and installation documentation:
          # https://vulkan.lunarg.com/sdk/home
          # https://vulkan.lunarg.com/doc/view/latest/linux/getting_started.html
          vulkan_archive="$RUNNER_TEMP/vulkan-sdk.tar.xz"
          curl --fail --location --retry 3 \
            "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkan_sdk.tar.xz" \
            --output "$vulkan_archive"
          echo "${VULKAN_SDK_SHA256}  ${vulkan_archive}" | sha256sum --check --strict
          vulkan_root="$RUNNER_TEMP/vulkan-sdk"
          mkdir -p "$vulkan_root"
          tar -xf "$vulkan_archive" -C "$vulkan_root"
          vulkan_sdk_dir="$(find "$vulkan_root" -mindepth 2 -maxdepth 2 -type d -name x86_64 -print -quit)"
          test -n "$vulkan_sdk_dir"
          test -s "$vulkan_sdk_dir/include/vulkan/vulkan.h"
          {
            echo "VULKAN_SDK=$vulkan_sdk_dir"
            echo "PATH=$vulkan_sdk_dir/bin:$PATH"
            echo "LD_LIBRARY_PATH=$vulkan_sdk_dir/lib:${LD_LIBRARY_PATH:-}"
            echo "CMAKE_PREFIX_PATH=$vulkan_sdk_dir:$vulkan_sdk_dir/lib/VulkanLoader:${CMAKE_PREFIX_PATH:-}"
          } >> "$GITHUB_ENV"
          export VULKAN_SDK="$vulkan_sdk_dir"
          export PATH="$VULKAN_SDK/bin:$PATH"
          vulkaninfo --summary || true

      - name: Provision Cozo C API
        shell: bash
        run: |
          set -euo pipefail
          cozo_root="$RUNNER_TEMP/cozo-${COZO_VERSION}"
          cozo_lib="$RUNNER_TEMP/libcozo_c-${COZO_VERSION}.so"
          git clone --depth 1 --branch "v${COZO_VERSION}" \
            https://github.com/cozodb/cozo.git "$cozo_root"
          curl --fail --location --retry 3 \
            "https://github.com/cozodb/cozo/releases/download/v${COZO_VERSION}/libcozo_c-${COZO_VERSION}-x86_64-unknown-linux-gnu.so.gz" \
            | gzip -d > "$cozo_lib"
          test -s "$cozo_root/cozo-lib-c/cozo_c.h"
          test -s "$cozo_lib"
          {
            echo "COZO_INCLUDE_DIR=$cozo_root/cozo-lib-c"
            echo "COZO_LIBRARY=$cozo_lib"
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP:${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"

      - name: Configure release build
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          backend_flags=(
            -DGGML_CPU=ON
            -DGGML_OPENMP=ON
            -DGGML_CUDA=OFF
            -DGGML_VULKAN=OFF
            -DGGML_NATIVE=OFF
          )
          case "$BACKEND" in
            cuda)
              backend_flags+=( -DGGML_CUDA=ON )
              ;;
            vulkan)
              backend_flags+=( -DGGML_VULKAN=ON )
              ;;
            cpu)
              ;;
            *)
              echo "Unknown backend: $BACKEND" >&2
              exit 1
              ;;
          esac

          cmake -S . -B "build-agent-release-$BACKEND" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_BUILD_TESTS=ON \
            -DBUILD_TESTING=ON \
            -DLLAMA_TESTS_INSTALL=OFF \
            -DLLAMA_AGENT_PACKAGE_INSTALL=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_USE_PREBUILT_UI=OFF \
            -DLLAMA_TOOLS_INSTALL=OFF \
            -DLLAMA_MEMORY_COZO=ON \
            -DLLAMA_PLAN_COZO=ON \
            -DLLAMA_AGENT_RUNTIME=ON \
            -DLLAMA_AGENT_TOOLS_CLANG=ON \
            "${backend_flags[@]}" \
            -DCOZO_INCLUDE_DIR="$COZO_INCLUDE_DIR" \
            -DCOZO_LIBRARY="$COZO_LIBRARY"

      - name: Build release agent pack
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          cmake --build "build-agent-release-$BACKEND" \
            --parallel 4 \
            --target llama-agent-build-pack

      - name: Run release agent tests
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          if [[ "$BACKEND" == cuda ]]; then
            # The hosted runner has no NVIDIA driver. CUDA-linked test
            # binaries only need the toolkit's runtime stub here.
            export LD_LIBRARY_PATH="/usr/local/cuda/lib64/stubs:${LD_LIBRARY_PATH:-}"
          fi
          ctest --test-dir "build-agent-release-$BACKEND" \
            -L agent \
            --output-on-failure \
            --timeout 900

      - name: Install and package release
        id: package
        env:
          BACKEND: ${{ matrix.backend }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          SOURCE_REF: ${{ inputs.source_ref || github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == llama-agent-v* ]] || {
            echo "Release tag must use the llama-agent-v* format" >&2
            exit 1
          }
          release_version="${RELEASE_TAG#llama-agent-v}"
          upstream_build="$(git describe --tags --match 'b[0-9]*' --abbrev=0 2>/dev/null || printf '%s' unknown)"
          agent_version="${release_version}"
          agent_build="${GITHUB_RUN_NUMBER}"
          package_version="${agent_version}+build.${agent_build}.llama.${upstream_build}"
          artifact_version="${agent_version}-build${agent_build}-llama-${upstream_build}"

          package_dir="agent-package-$BACKEND"
          rm -rf "$package_dir"
          cmake --install "build-agent-release-$BACKEND" --prefix "$package_dir"
          mkdir -p "$package_dir/lib"
          cp "$COZO_LIBRARY" "$package_dir/lib/libcozo_c.so"
          test -f "$package_dir/bin/llama-agent"
          test -f "$package_dir/bin/llama-agent-daemon"
          test -f "$package_dir/bin/llama-agent-mcp-stdio-server"
          test -x "$package_dir/bin/llama-agent-config-bootstrap"
          test -f "$package_dir/lib/libllama-agent-core.so"
          test -f "$package_dir/lib/libllama-agent-memory.so"
          test -f "$package_dir/lib/libllama-agent-plan.so"
          test -f "$package_dir/lib/libllama-agent-mcp-core.so"
          test -f "$package_dir/lib/libllama-agent-mcp-server.so"
          test -f "$package_dir/lib/libllama-agent-runtime-support.so"
          test -f "$package_dir/lib/libllama-agent-storage-cozo.so"

          printf '%s\n' \
            "release_tag=$RELEASE_TAG" \
            "backend=$BACKEND" \
            "source_ref=$SOURCE_REF" \
            "commit_sha=$(git rev-parse HEAD)" \
            "agent_version=$agent_version" \
            "agent_build=$agent_build" \
            "upstream_build=$upstream_build" \
            "package_version=$package_version" \
            "cozo_version=$COZO_VERSION" \
            "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$package_dir/AGENT-RELEASE-MANIFEST.txt"

          archive="llama-agent-${artifact_version}-${BACKEND}-linux-x64.tar.gz"
          # Keep archive permissions portable across Docker, Podman and native
          # installs; runner-local private directory modes must not be shipped.
          chmod -R u+rwX,go+rX "$package_dir"
          tar -czf "$archive" -C "$package_dir" .
          sha256sum "$archive" > "${archive}.sha256"

      - name: Upload backend package
        uses: actions/upload-artifact@v6
        with:
          name: llama-agent-release-${{ matrix.backend }}
          path: |
            llama-agent-*-${{ matrix.backend }}-linux-x64.tar.gz
            llama-agent-*-${{ matrix.backend }}-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  build-debian-release:
    name: Build Debian ${{ matrix.backend }} release package
    runs-on: ubuntu-24.04
    # CUDA Debian packaging can exceed 75 minutes on GitHub-hosted runners.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        backend:
          - cpu
          - cuda
          - vulkan

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0

      - name: Verify release source is on master history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --no-tags
          git merge-base --is-ancestor HEAD origin/master || {
            echo 'Release source must be an ancestor of origin/master' >&2
            exit 1
          }

      - name: Install common Debian build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            clangd \
            cmake \
            curl \
            debhelper-compat \
            dpkg-dev \
            git \
            libssl-dev \
            ninja-build \
            pkg-config \
            zlib1g-dev

      - name: Install CUDA build dependencies
        if: matrix.backend == 'cuda'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb \
            --output "$RUNNER_TEMP/cuda-keyring.deb"
          sudo dpkg -i "$RUNNER_TEMP/cuda-keyring.deb"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "$CUDA_TOOLKIT_PACKAGE"
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
          echo "CUDA_HOME=/usr/local/cuda" >> "$GITHUB_ENV"
          export PATH="/usr/local/cuda/bin:$PATH"
          nvcc --version

      - name: Install Vulkan build dependencies
        if: matrix.backend == 'vulkan'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            glslang-tools \
            glslc \
            libvulkan-dev \
            spirv-headers
          pkg-config --modversion vulkan

      - name: Provision Cozo C API
        shell: bash
        run: |
          set -euo pipefail
          cozo_root="$RUNNER_TEMP/cozo-${COZO_VERSION}"
          cozo_lib="$RUNNER_TEMP/libcozo_c-${COZO_VERSION}.so"
          git clone --depth 1 --branch "v${COZO_VERSION}" \
            https://github.com/cozodb/cozo.git "$cozo_root"
          curl --fail --location --retry 3 \
            "https://github.com/cozodb/cozo/releases/download/v${COZO_VERSION}/libcozo_c-${COZO_VERSION}-x86_64-unknown-linux-gnu.so.gz" \
            | gzip -d > "$cozo_lib"
          test -s "$cozo_root/cozo-lib-c/cozo_c.h"
          test -s "$cozo_lib"
          {
            echo "COZO_INCLUDE_DIR=$cozo_root/cozo-lib-c"
            echo "COZO_LIBRARY=$cozo_lib"
          } >> "$GITHUB_ENV"

      - name: Prepare release metadata
        id: metadata
        env:
          BACKEND: ${{ matrix.backend }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == llama-agent-v* ]] || {
            echo "Release tag must use the llama-agent-v* format" >&2
            exit 1
          }
          agent_version="${RELEASE_TAG#llama-agent-v}"
          agent_build="${GITHUB_RUN_NUMBER}"
          upstream_build="$(git describe --tags --match 'b[0-9]*' --abbrev=0 2>/dev/null || printf '%s' unknown)"
          package_version="${agent_version}+build.${agent_build}.llama.${upstream_build}"
          artifact_version="${agent_version}-build${agent_build}-llama-${upstream_build}"
          package_name="llama-agent-${BACKEND}"
          {
            echo "agent_version=$agent_version"
            echo "agent_build=$agent_build"
            echo "upstream_build=$upstream_build"
            echo "package_version=$package_version"
            echo "artifact_version=$artifact_version"
            echo "package_name=$package_name"
          } >> "$GITHUB_OUTPUT"

          python3 - "$package_version" "$RELEASE_TAG" "$BACKEND" "$package_name" <<'PY'
          from pathlib import Path
          import sys

          version, tag, backend, package_name = sys.argv[1:]
          changelog = Path("debian/changelog")
          existing = changelog.read_text()
          entry = (
              f"llama-agent ({version}-1) stable; urgency=medium\n\n"
              f"  * Release {tag} with the {backend} backend.\n\n"
              " -- Peter Kallden <kallden.peter@gmail.com>  "
              "Thu, 01 Jan 1970 00:00:00 +0000\n\n"
          )
          changelog.write_text(entry + existing)

          control = Path("debian/control")
          text = control.read_text()
          other_packages = [
              f"llama-agent-{candidate}"
              for candidate in ("cpu", "cuda", "vulkan")
              if candidate != backend
          ]
          replacement = (
              f"Package: {package_name}\n"
              "Provides: llama-agent-backend\n"
              f"Conflicts: {', '.join(other_packages)}\n"
              f"Replaces: {', '.join(other_packages)}"
          )
          marker = "Package: llama-agent\n"
          if text.count(marker) != 1:
              raise SystemExit("expected exactly one generic Debian package stanza")
          control.write_text(text.replace(marker, replacement + "\n", 1))

          for suffix in ("install", "docs", "postinst", "prerm", "service", "tmpfiles"):
              source = Path(f"debian/llama-agent.{suffix}")
              target = Path(f"debian/{package_name}.{suffix}")
              target.write_text(source.read_text())
              source.unlink()
          PY

      - name: Build Debian package
        env:
          BACKEND: ${{ matrix.backend }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package_version }}
          ARTIFACT_VERSION: ${{ steps.metadata.outputs.artifact_version }}
          PACKAGE_NAME: ${{ steps.metadata.outputs.package_name }}
        shell: bash
        run: |
          set -euo pipefail
          LLAMA_AGENT_BACKEND="$BACKEND" \
            LLAMA_AGENT_NATIVE=off \
            dpkg-buildpackage -us -uc -b
          raw_package="$(find .. -maxdepth 1 -type f -name "${PACKAGE_NAME}_*.deb" -print -quit)"
          test -n "$raw_package"
          test "$(dpkg-deb -f "$raw_package" Package)" = "$PACKAGE_NAME"
          test "$(dpkg-deb -f "$raw_package" Version)" = "${PACKAGE_VERSION}-1"
          mkdir -p debian-release-artifacts
          package="debian-release-artifacts/${PACKAGE_NAME}_${PACKAGE_VERSION}-1_amd64.deb"
          cp "$raw_package" "$package"
          dpkg-deb --contents "$package" | grep -F 'usr/sbin/llama-agent-daemon'
          dpkg-deb --contents "$package" | grep -F 'usr/share/doc/llama-agent/examples/'
          sha256sum "$package" > "${package}.sha256"
          printf '%s\n' \
            "package=${PACKAGE_NAME}" \
            "version=${PACKAGE_VERSION}-1" \
            "backend=${BACKEND}" \
            "release_tag=${{ inputs.release_tag || github.ref_name }}" \
            "source_ref=${{ inputs.source_ref || github.ref }}" \
            "commit_sha=$(git rev-parse HEAD)" \
            "agent_version=${{ steps.metadata.outputs.agent_version }}" \
            "agent_build=${{ steps.metadata.outputs.agent_build }}" \
            "upstream_build=${{ steps.metadata.outputs.upstream_build }}" \
            "cozo_version=$COZO_VERSION" \
            "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > debian-release-artifacts/AGENT-DEBIAN-RELEASE-MANIFEST.txt

      - name: Upload Debian backend package
        uses: actions/upload-artifact@v6
        with:
          name: llama-agent-release-debian-${{ matrix.backend }}
          path: debian-release-artifacts/**
          if-no-files-found: error
          retention-days: 30

  build-windows-release:
    name: Build Windows ${{ matrix.backend }} release package
    runs-on: windows-2022
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        backend:
          - cpu
          - cuda
          - vulkan

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0

      - name: Verify release source is on master history
        shell: pwsh
        run: |
          git fetch origin master --no-tags
          $isAncestor = git merge-base --is-ancestor HEAD origin/master
          if ($LASTEXITCODE -ne 0) {
            throw 'Release source must be an ancestor of origin/master'
          }

      - name: Provision Cozo C API
        shell: pwsh
        run: |
          $cozoRoot = Join-Path $env:RUNNER_TEMP "cozo-$env:COZO_VERSION"
          git clone --depth 1 --branch "v$env:COZO_VERSION" `
            https://github.com/cozodb/cozo.git $cozoRoot
          $cozoArchive = Join-Path $cozoRoot "libcozo_c-$env:COZO_VERSION-x86_64-pc-windows-msvc.lib.zip"
          gh release download "v$env:COZO_VERSION" `
            --repo cozodb/cozo `
            --pattern "libcozo_c-$env:COZO_VERSION-x86_64-pc-windows-msvc.lib.zip" `
            --dir $cozoRoot
          if (-not (Test-Path $cozoArchive)) {
            throw "Cozo library archive was not downloaded: $cozoArchive"
          }
          Expand-Archive -LiteralPath $cozoArchive -DestinationPath $cozoRoot -Force
          $cozoLibrary = Get-ChildItem -Path $cozoRoot `
            -Filter "libcozo_c-$env:COZO_VERSION-x86_64-pc-windows-msvc.lib" `
            -File -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not (Test-Path (Join-Path $cozoRoot 'cozo-lib-c\cozo_c.h'))) {
            throw 'Cozo header was not provisioned'
          }
          if ([string]::IsNullOrWhiteSpace($cozoLibrary) -or -not (Test-Path -LiteralPath $cozoLibrary)) {
            throw "Cozo library was not provisioned: $cozoLibrary"
          }
          "COZO_INCLUDE_DIR=$cozoRoot\cozo-lib-c" | Out-File $env:GITHUB_ENV -Append
          "COZO_LIBRARY=$cozoLibrary" | Out-File $env:GITHUB_ENV -Append

      - name: Install CUDA Toolkit
        if: matrix.backend == 'cuda'
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.3'

      - name: Install Ninja for CUDA generator
        if: matrix.backend == 'cuda'
        shell: pwsh
        run: choco install ninja --yes

      - name: Install Vulkan SDK
        if: matrix.backend == 'vulkan'
        shell: pwsh
        run: |
          $vulkanVersion = '1.4.357.0'
          $installer = Join-Path $env:RUNNER_TEMP 'VulkanSDK-Installer.exe'
          $url = "https://sdk.lunarg.com/sdk/download/$vulkanVersion/windows/vulkansdk-windows-X64-$vulkanVersion.exe"
          curl.exe --fail --location --retry 3 --output $installer $url
          & $installer --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VULKAN_SDK=C:\VulkanSDK\$vulkanVersion" | Out-File $env:GITHUB_ENV -Append
          "C:\VulkanSDK\$vulkanVersion\bin" | Out-File $env:GITHUB_PATH -Append

      - name: Prepare release metadata
        id: metadata
        shell: pwsh
        run: |
          $releaseTag = '${{ inputs.release_tag || github.ref_name }}'
          if (-not $releaseTag.StartsWith('llama-agent-v')) {
            throw 'Release tag must use the llama-agent-v* format'
          }
          $agentVersion = $releaseTag.Substring('llama-agent-v'.Length)
          $agentBuild = $env:GITHUB_RUN_NUMBER
          $upstreamBuild = (git describe --tags --match 'b[0-9]*' --abbrev=0 2>$null)
          if ([string]::IsNullOrWhiteSpace($upstreamBuild)) { $upstreamBuild = 'unknown' }
          $packageVersion = "$agentVersion+build.$agentBuild.llama.$upstreamBuild"
          $artifactVersion = "$agentVersion-build$agentBuild-llama-$upstreamBuild"
          $backendVersion = switch ('${{ matrix.backend }}') {
            'cpu' { '' }
            'cuda' { '13' }
            'vulkan' { '1.4' }
            default { throw 'Unsupported Windows release backend' }
          }
          $backendExactVersion = switch ('${{ matrix.backend }}') {
            'cpu' { 'native' }
            'cuda' { '13.3' }
            'vulkan' { '1.4.357.0' }
            default { throw 'Unsupported Windows release backend' }
          }
          $backendLabel = if ($backendVersion) {
            "${{ matrix.backend }}$backendVersion"
          } else {
            '${{ matrix.backend }}'
          }
          $packageName = "llama-agent-$backendLabel-windows-x64-$artifactVersion"
          @(
            "agent_version=$agentVersion"
            "agent_build=$agentBuild"
            "upstream_build=$upstreamBuild"
            "package_version=$packageVersion"
            "artifact_version=$artifactVersion"
            "backend=${{ matrix.backend }}"
            "backend_version=$backendExactVersion"
            "backend_label=$backendLabel"
            "package_name=$packageName"
          ) | Out-File $env:GITHUB_OUTPUT -Append

      - name: Configure Windows release build and CPack
        shell: pwsh
        run: |
          $vsDevCmd = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat'
          if (-not (Test-Path $vsDevCmd)) {
            $vsDevCmd = 'C:\Program Files\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvarsall.bat'
          }
          if (-not (Test-Path $vsDevCmd)) {
            throw 'Visual Studio x64 developer environment was not found'
          }
          $backendFlags = switch ('${{ matrix.backend }}') {
            'cpu' { '-DGGML_CPU=ON -DGGML_CUDA=OFF -DGGML_VULKAN=OFF' }
            'cuda' { '-DGGML_CPU=ON -DGGML_CUDA=ON -DGGML_VULKAN=OFF -DGGML_CUDA_CUB_3DOT2=ON' }
            'vulkan' { '-DGGML_CPU=ON -DGGML_CUDA=OFF -DGGML_VULKAN=ON' }
            default { throw 'Unsupported Windows release backend' }
          }
          $generatorArguments = if ('${{ matrix.backend }}' -eq 'cuda') {
            '-G "Ninja Multi-Config"'
          } else {
            '-G "Visual Studio 17 2022" -A x64'
          }
          $configure = @(
            "cmake -S . -B build-agent-windows-release $generatorArguments",
            '-DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_TESTS=OFF -DBUILD_TESTING=OFF',
            '-DLLAMA_TESTS_INSTALL=OFF -DLLAMA_AGENT_PACKAGE_INSTALL=ON',
            '-DLLAMA_AGENT_PACKAGE_CPACK=ON',
            '-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_APP=OFF',
            '-DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF',
            '-DLLAMA_TOOLS_INSTALL=OFF -DLLAMA_MEMORY_COZO=ON',
            '-DLLAMA_PLAN_COZO=ON -DLLAMA_AGENT_RUNTIME=ON',
            '-DLLAMA_AGENT_TOOLS_CLANG=ON -DLLAMA_SUBPROCESS=ON',
            $backendFlags,
            "-DCPACK_PACKAGE_NAME=${{ steps.metadata.outputs.package_name }}",
            "-DCPACK_PACKAGE_VERSION=${{ steps.metadata.outputs.agent_version }}",
            "-DCPACK_PACKAGE_FILE_NAME=${{ steps.metadata.outputs.package_name }}",
            "-DCOZO_INCLUDE_DIR=`"$env:COZO_INCLUDE_DIR`"",
            "-DCOZO_LIBRARY=`"$env:COZO_LIBRARY`"",
            '-DLLAMA_AGENT_CLANG_EXECUTABLE=clang.exe -DLLAMA_AGENT_CLANGD_EXECUTABLE=clangd.exe'
          ) -join ' '
          $command = "call `"$vsDevCmd`" x64 && $configure"
          cmd.exe /d /c $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows release package target
        shell: pwsh
        run: |
          $vsDevCmd = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat'
          if (-not (Test-Path $vsDevCmd)) {
            $vsDevCmd = 'C:\Program Files\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvarsall.bat'
          }
          if (-not (Test-Path $vsDevCmd)) {
            throw 'Visual Studio x64 developer environment was not found'
          }
          $command = "call `"$vsDevCmd`" x64 && cmake --build build-agent-windows-release --config Release --parallel 3 --target llama-agent-build-pack"
          cmd.exe /d /c $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and smoke-test Windows release staging tree
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force package-root -ErrorAction SilentlyContinue
          cmake --install build-agent-windows-release --config Release --prefix package-root
          $required = @(
            'bin\llama-agent.exe',
            'bin\llama-agent-daemon.exe',
            'bin\llama-agent-mcp-stdio-server.exe',
            'bin\llama-agent-web.exe',
            'bin\llama-agent-core.dll',
            'bin\llama-agent-memory.dll',
            'bin\llama-agent-plan.dll',
            'bin\llama-agent-config-bootstrap.ps1',
            'share\llama-agent\examples\agent-config.example.json',
            'share\llama-agent\examples\llama-agent.web\README.md',
            'share\llama-agent\examples\llama-agent.web\nginx\llama-agent-web.conf'
          )
          foreach ($path in $required) {
            if (-not (Test-Path (Join-Path 'package-root' $path))) {
              throw "Missing installed agent file: $path"
            }
          }
          $configSmoke = Join-Path $env:RUNNER_TEMP 'llama-agent-config-bootstrap-release.json'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File package-root\bin\llama-agent-config-bootstrap.ps1 -Output $configSmoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $configSmoke)) { throw 'Windows release config smoke did not produce output' }

      - name: Create Windows release ZIP and MSI
        shell: pwsh
        run: |
          $packageName = '${{ steps.metadata.outputs.package_name }}'
          7z a -tzip "$packageName.zip" .\package-root\*
          cpack --config build-agent-windows-release\CPackConfig.cmake -G WIX -C Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msi = Get-Item -LiteralPath "$packageName.msi" -ErrorAction SilentlyContinue
          if (-not $msi) { throw 'CPack did not produce the Windows release MSI' }
          @(
            "release_tag=${{ inputs.release_tag || github.ref_name }}"
            "backend=${{ matrix.backend }}"
            "backend_version=${{ steps.metadata.outputs.backend_version }}"
            "backend_label=${{ steps.metadata.outputs.backend_label }}"
            "package=$packageName"
            "agent_version=${{ steps.metadata.outputs.agent_version }}"
            "agent_build=${{ steps.metadata.outputs.agent_build }}"
            "upstream_build=${{ steps.metadata.outputs.upstream_build }}"
            "commit_sha=$(git rev-parse HEAD)"
            "cozo_version=$env:COZO_VERSION"
            "created_at=$([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))"
          ) | Set-Content AGENT-WINDOWS-RELEASE-MANIFEST.txt
          Get-FileHash "$packageName.zip","$packageName.msi" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content SHA256SUMS

      - name: Upload Windows release package
        uses: actions/upload-artifact@v6
        with:
          name: llama-agent-release-windows-${{ matrix.backend }}
          path: |
            llama-agent-${{ steps.metadata.outputs.backend_label }}-windows-x64-*.zip
            llama-agent-${{ steps.metadata.outputs.backend_label }}-windows-x64-*.msi
            AGENT-WINDOWS-RELEASE-MANIFEST.txt
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish verified release packages
    needs:
      - build-release
      - build-debian-release
      - build-windows-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Download backend packages
        uses: actions/download-artifact@v6
        with:
          pattern: llama-agent-release-*
          path: artifacts
          merge-multiple: true

      - name: Create combined checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz *.deb *.zip *.msi > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          SOURCE_REF: ${{ inputs.source_ref || github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_REF" \
            --title "llama-agent $RELEASE_TAG" \
            --generate-notes
